          - paragraph [ref=f1e796]: Episode 4 loses viewers during a long exposition scene, dropping from 81% to 20% retention in the minute starting at 2531s in scene 13.
          - paragraph [ref=f1e797]: This is a story problem. The audience drain is not isolated to any particular delivery segment (CDN, device, or region), and there is no spike in rebuffering that would indicate a technical fault. The drop-off happens right after a major reveal, suggesting the exposition that follows is the issue.
          - paragraph [ref=f1e798]: "### The SceneThe drop-off occurs in scene 13, which comes directly after a confession in scene 12."
          - list [ref=f1e799]:
            - listitem [ref=f1e800]:
              - text: "Scene 12:"
              - code [ref=f1e801]: INT. KELLEHER HOUSE - PORCH - NIGHT
              - text: (reveal)
          - text: "- Summary: June confesses: she saw the boat that night from the porch. She saw two boats. She went back to bed. - Excerpt:"
          - code [ref=f1e802]: "JUNE: I saw two boats. I saw his and I saw the other one and I went back to bed, Nora. I went back to bed."
          - list [ref=f1e803]:
            - listitem [ref=f1e804]:
              - text: "Scene 13:"
              - code [ref=f1e805]: INT. HARBORMASTER'S OFFICE - NIGHT
              - text: (exposition)
          - text: "- Summary: Gil lays out the entire dredging permit history: the 2019 application, the environmental review, the quota transfer clause, who signed what and when. - Excerpt:"
          - code [ref=f1e806]: "GIL: The 2019 application was denied. Then in 2021 it comes back with a quota transfer clause nobody asked for. Now look at the environmental review — see the date? Same week the county changed assessors. And here —"
          - paragraph [ref=f1e807]: "### Rewatch HotspotsInterestingly, the same scene that causes the drop-off is also the most rewatched part of the episode. This suggests that while some viewers are leaving, others are trying to grasp the details of the permit history. Other rewatched scenes involve the dashcam footage and the identification of the truck."
