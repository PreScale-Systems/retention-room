          - generic [ref=f1e846]: editor
          - paragraph [ref=f1e847]: In Episode 4, we're losing the audience in the harbormaster's office. During Gil's one-minute explanation of the dredging permits in scene 13, retention plummets from 81% to 20%. The data confirms this is a story problem, not a technical delivery issue.
          - paragraph [ref=f1e848]: The drop happens right after June's powerful porch confession. This is a classic case of a dry exposition scene killing the momentum of a major reveal. The audience is primed for emotional fallout, and we give them administrative history instead.
          - paragraph [ref=f1e849]: We have a couple of options. We can recut the scene, trimming Gil’s monologue by 30-40 seconds to focus only on the key players and the illegal clause. Or, we could break up the information, moving less critical details to a later beat. For next season, this is a clear lesson in weaving in discovery rather than dumping it.
          - paragraph [ref=f1e850]: Interestingly, the permit scene is also a rewatch hotspot, meaning the information is important but the delivery is too dense. The audience also loves the dashcam and truck identification scenes; let's use the truck reveal for the "previously on".
          - paragraph [ref=f1e851]: My first move would be to recut the scene.
